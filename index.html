<!doctype html>
<html lang="vi">
  <head>

    <title>Nhận 100 tỷ</title>

  </head>
  <body>
    <div class="card">
      <h1>🎉 Chúc mừng bạn!</h1>

      <button onclick="chaoMung()">Bấm vào đây thử đi</button>

    <script>
      function chaoMung() {
        document.getElementById("thongbao").innerHTML =
          "diễn<br>" + "Bôn<br>" + "Trưởng<br>" + "Hạnh<br>" + "Trức<br>"+"xem làm chó";
      }
    </script>
